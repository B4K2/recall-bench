[project]
name = "recall-bench"
version = "0.2.0"
description = "Zero-shot long-range recall benchmark for genomic language models"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Akshat Balyan" }]
keywords = ["genomics", "dna", "language-models", "benchmark", "long-context", "recall"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core: enough to benchmark your own model (CallableModel) on a prepared background.
dependencies = [
    "torch>=2.6.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Hugging Face checkpoints (registry baselines, `recall-bench run-hf`).
hf = ["transformers>=4.46", "huggingface-hub>=0.26", "einops>=0.8", "python-dotenv>=1.0"]
# Building the hg38 / wikitext backgrounds (`recall-bench prepare`).
data = ["biopython>=1.84", "datasets>=3.0"]
# Mnemos-DNA arms, Caduceus loader, and GLA/DeltaNet text controls.
mnemos = ["recall-bench[hf]", "flash-linear-attention>=0.5.2"]
all = ["recall-bench[hf,data,mnemos]"]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[project.scripts]
recall-bench = "recall_bench.cli:main"

[project.urls]
Repository = "https://github.com/B4K2/recall-bench"

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recall_bench"]
