# Shared defaults for all D01-D07 arms. Model configs override only what changes.
# Do not edit after any arm has begun training (see CLAUDE.md "Rerunning a model").

model_id: base
run_name: base

d_model: 768
num_layers: 12
num_heads: 12
vocab_size: 8            # A, C, G, T, N + PAD/BOS/UNK

pos_type: none            # none | ntk_rope
attention_type: kda        # kda | kda_local | kda_full_attn | hyena

context_length: 65536
batch_size: 1
grad_accum_steps: 64
gradient_checkpointing: true
precision: bf16

optimizer: adamw
learning_rate: 3.0e-4
weight_decay: 0.1
warmup_steps: 2000


training_tokens: 1_000_000_000

dataset_dir: data/hg38
eval_interval_steps: 2000
eval_batches: 40              # val batches per eval (no_grad; 40 x ctx tokens). Was hardcoded 20 -> +-0.03 noise.
checkpoint_interval_steps: 10   # ~400s/step -> checkpoint roughly hourly; 75 meant 8h of blast radius

mlflow_tracking_uri: sqlite:///mlflow.db
mlflow_experiment: dna-kda-ablation
